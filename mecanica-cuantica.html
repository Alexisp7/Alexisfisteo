<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mecánica Cuántica — Alexis R. Salvatierra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #C8A96E;
      --gold-light: #E8D5A3;
      --black: #111111;
      --dark: #1A1A1A;
      --gray: #4A4A4A;
      --gray-light: #7A7A7A;
      --border: #E0DDD8;
      --bg-off: #F7F6F3;
      --bg-dark: #111111;
      --white: #FFFFFF;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--dark);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .gold { color: var(--gold); }

    hr.gold-line {
      border: none;
      height: 0.5px;
      background: var(--gold);
    }

    hr.thin-line {
      border: none;
      height: 0.5px;
      background: var(--border);
    }

    /* ────────────────────────────────
       ORNAMENTOS GRIEGOS
    ──────────────────────────────── */
    .greek-ornament {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 auto 48px;
      justify-content: flex-start;
    }

    .greek-ornament span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 0.1em;
      line-height: 1;
      user-select: none;
    }

    .greek-ornament::before,
    .greek-ornament::after {
      content: '';
      flex: 0 0 40px;
      height: 0.5px;
      background: var(--gold);
    }

    .greek-ornament::before { flex: 0 0 0; }

    /* Meandro griego (key pattern) como separador */
    .meander-divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 32px 0;
    }

    .meander-line {
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }

    .meander-symbol {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: 0.3em;
    }

    /* ────────────────────────────────
       HEADER
    ──────────────────────────────── */
    .header {
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* Franja griega superior */
    .header-greek-bar {
      height: 4px;
      background: var(--black);
      position: relative;
      overflow: hidden;
    }

    .header-greek-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        var(--gold) 0px,
        var(--gold) 3px,
        transparent 3px,
        transparent 7px,
        var(--gold) 7px,
        var(--gold) 10px,
        transparent 10px,
        transparent 18px
      );
      opacity: 0.6;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .site-logo {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .site-logo-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--black);
    }

    .site-logo-subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
    }

    /* Logo symbol: phi */
    .logo-phi {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 400;
      color: var(--gold);
      line-height: 1;
      margin-right: 14px;
      opacity: 0.85;
    }

    .logo-group {
      display: flex;
      align-items: center;
    }

    /* NAV */
    nav.main-nav {
      display: flex;
      align-items: center;
      gap: 0;
    }

    nav.main-nav a {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      text-decoration: none;
      padding: 8px 20px;
      position: relative;
      z-index: 0;
      transition: color 0.28s ease;
    }

    /* Sliding black box behind nav link */
    nav.main-nav a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--black);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: -1;
    }

    nav.main-nav a:hover::before,
    nav.main-nav a.active::before {
      transform: scaleX(1);
    }

    nav.main-nav a:hover,
    nav.main-nav a.active {
      color: var(--white);
    }

    nav.main-nav .nav-sep {
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      font-size: 18px;
      font-weight: 300;
      line-height: 1;
      opacity: 0.7;
      user-select: none;
    }


    .header-border {
      height: 0.5px;
      background: var(--gold);
    }

    /* ────────────────────────────────
       HERO
    ──────────────────────────────── */
    .hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 88px 48px 80px;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 80px;
      align-items: center;
    }

    .hero-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-eyebrow::before {
      content: 'Ψ';
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 400;
    }

    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 700;
      line-height: 1.0;
      color: var(--black);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .hero-name em {
      font-style: italic;
      font-weight: 500;
      color: var(--dark);
    }

    .hero-title-line {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      font-style: italic;
      color: var(--gray);
      letter-spacing: 0.02em;
    }

    .title-sep {
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      font-size: 22px;
    }

    .hero-bio {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.85;
      color: var(--gray);
      max-width: 480px;
      margin-bottom: 40px;
    }

    .hero-stats {
      display: flex;
      gap: 40px;
      padding-top: 32px;
      border-top: 0.5px solid var(--border);
    }

    .stat-item {}

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--black);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 5px;
    }

    .stat-sub {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--gray-light);
      margin-top: 2px;
    }

    /* Hero image */
    .hero-image-wrap {
      position: relative;
    }

    .hero-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--bg-off);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-ph {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .photo-ph-icon {
      width: 64px;
      height: 64px;
      border: 0.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 28px;
    }

    .photo-ph-text {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .hero-frame {
      position: absolute;
      top: -18px;
      right: -18px;
      bottom: 18px;
      left: 18px;
      border: 0.5px solid var(--gold);
      z-index: -1;
    }

    /* Greek corner ornaments on photo */
    .corner-ornament {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--gold);
      border-style: solid;
    }

    .corner-ornament.tl {
      top: 0; left: 0;
      border-width: 1.5px 0 0 1.5px;
    }

    .corner-ornament.tr {
      top: 0; right: 0;
      border-width: 1.5px 1.5px 0 0;
    }

    .corner-ornament.bl {
      bottom: 0; left: 0;
      border-width: 0 0 1.5px 1.5px;
    }

    .corner-ornament.br {
      bottom: 0; right: 0;
      border-width: 0 1.5px 1.5px 0;
    }

    /* ────────────────────────────────
       SECTION COMMON
    ──────────────────────────────── */
    .section {
      padding: 88px 48px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-header {
      margin-bottom: 56px;
    }

    .section-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-eyebrow::before {
      content: '';
      width: 28px;
      height: 0.5px;
      background: var(--gold);
      display: block;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .section-title em {
      font-style: italic;
      font-weight: 500;
    }

    /* ────────────────────────────────
       CURSOS
    ──────────────────────────────── */
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border: 0.5px solid var(--border);
    }

    .course-card {
      padding: 36px 32px;
      border: 0.5px solid var(--border);
      position: relative;
      transition: background 0.25s;
      background: var(--white);
    }

    .course-card:hover {
      background: var(--bg-off);
    }

    /* Greek key border top on hover */
    .course-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.25s;
    }

    .course-card:hover::before {
      background: var(--gold);
    }

    .course-icon-box {
      width: 48px;
      height: 48px;
      border: 0.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      color: var(--gold);
      position: relative;
    }

    .course-icon-box svg {
      width: 22px;
      height: 22px;
      stroke: var(--gold);
      stroke-width: 1.5;
      fill: none;
    }

    /* Corner dots on icon box */
    .course-icon-box::before,
    .course-icon-box::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--white);
      border: 0.5px solid var(--gold);
    }

    .course-icon-box::before { top: -2px; right: -2px; }
    .course-icon-box::after  { bottom: -2px; left: -2px; }

    .course-level {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .course-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .course-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--gray);
      line-height: 1.75;
      margin-bottom: 24px;
    }

    .course-cta {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .course-cta::after {
      content: '→';
      font-size: 14px;
      font-weight: 400;
      color: var(--gold);
    }

    /* ────────────────────────────────
       PROYECTOS
    ──────────────────────────────── */
    .projects-wrap {
      background: var(--bg-dark);
      padding: 88px 0;
    }

    .projects-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 48px;
    }

    .projects-inner .section-eyebrow {
      color: var(--gold);
    }

    .projects-inner .section-eyebrow::before {
      background: var(--gold);
    }

    .projects-inner .section-title {
      color: var(--white);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: #222;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #1A1A1A;
    }

    .project-card.square {
      aspect-ratio: 1 / 1;
    }

    .project-card.wide {
      grid-column: span 2;
      aspect-ratio: 2 / 1;
    }

    .project-card.tall {
      grid-row: span 2;
      aspect-ratio: 1 / 2.01;
    }

    .project-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .project-card:hover .project-img {
      transform: scale(1.04);
    }

    /* Placeholder cuando no hay imagen */
    .project-img-ph {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 280px;
    }

    .ph-icon {
      font-size: 36px;
      color: #2E2E2E;
    }

    .ph-text {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.2em;
      color: #2E2E2E;
      text-transform: uppercase;
    }

    .project-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    /* Blue hover tint overlay on project cards */
    .project-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(13,71,161,0.55) 0%, rgba(21,101,192,0.38) 50%, rgba(0,30,80,0.62) 100%);
      mix-blend-mode: multiply;
      opacity: 0;
      transition: opacity 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 1;
    }

    .project-card:hover::after {
      opacity: 1;
    }

    /* Keep info-always and star above the blue overlay */
    .project-info-always,
    .project-star,
    .project-greek-corner {
      z-index: 2;
    }

    .project-card:hover .project-overlay {
      opacity: 1;
    }

    /* Siempre visible: título en overlay permanente */
    .project-info-always {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 100%);
    }

    .project-badge {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .project-badge::before {
      content: '◆';
      font-size: 5px;
    }

    .project-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .project-card.wide .project-name {
      font-size: 26px;
    }

    .project-year {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.1em;
    }

    /* Star badge top-right */
    .project-star {
      position: absolute;
      top: 18px;
      right: 18px;
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-transform: uppercase;
      background: rgba(0,0,0,0.7);
      border: 0.5px solid var(--gold);
      padding: 5px 10px;
    }

    /* Greek ornament en esquina del proyecto featured */
    .project-greek-corner {
      position: absolute;
      top: 16px;
      left: 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      color: var(--gold);
      opacity: 0.5;
    }

    /* ────────────────────────────────
       SOBRE MÍ
    ──────────────────────────────── */
    .about-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 88px;
      align-items: start;
    }

    .about-photo-col { position: relative; }

    .about-photo {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: var(--bg-off);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .about-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-frame {
      position: absolute;
      top: 18px;
      left: -18px;
      right: 18px;
      bottom: -18px;
      border: 0.5px solid var(--gold);
      z-index: -1;
    }

    .about-text {}

    .about-body {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.9;
      color: var(--gray);
      margin-bottom: 28px;
    }

    .about-quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 500;
      font-style: italic;
      color: var(--black);
      line-height: 1.4;
      border-left: 1px solid var(--gold);
      padding-left: 28px;
      margin: 36px 0;
    }

    /* Greek quote marks */
    .about-quote::before {
      content: '«';
      color: var(--gold);
      font-style: normal;
      font-size: 30px;
      margin-right: 4px;
      vertical-align: -3px;
    }

    .about-quote::after {
      content: '»';
      color: var(--gold);
      font-style: normal;
      font-size: 30px;
      margin-left: 4px;
      vertical-align: -3px;
    }

    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 32px;
    }

    .skill-tag {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      border: 0.5px solid var(--border);
      padding: 7px 14px;
      transition: all 0.2s;
    }

    .skill-tag:hover {
      border-color: var(--gold);
      color: var(--black);
    }

    .skill-tag.accent {
      color: var(--gold);
      border-color: var(--gold);
      background: rgba(200,169,110,0.05);
    }

    /* ────────────────────────────────
       DECORATIVE STRIP (Greek key pattern)
    ──────────────────────────────── */
    .greek-strip {
      height: 12px;
      background: var(--black);
      position: relative;
      overflow: hidden;
    }

    .greek-strip::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 2px,
        var(--gold) 2px,
        var(--gold) 5px,
        transparent 5px,
        transparent 7px,
        var(--gold) 7px,
        var(--gold) 10px,
        transparent 10px,
        transparent 14px,
        var(--gold) 14px,
        var(--gold) 17px,
        transparent 17px,
        transparent 24px
      );
      opacity: 0.45;
    }

    .greek-strip::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }

    /* Enhance project name color on hover */
    .project-card:hover .project-name {
      color: #a8d4ff;
      transition: color 0.35s ease;
    }

  <script>
    // Átomos de plata que salen del horno y, al cruzar el imán, se van a
    // |↑⟩ o a |↓⟩ al azar; las manchas de la pantalla se encienden al llegar.
    (function () {
      var g = document.getElementById('sg-atomos');
      if (!g || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var NS = 'http://www.w3.org/2000/svg';
      var haz = document.getElementById('sg-haz');
      var ramas = [document.getElementById('sg-arriba'), document.getElementById('sg-abajo')];
      var manchas = [document.getElementById('sg-mancha-arriba'), document.getElementById('sg-mancha-abajo')];
      var brillo = [0.25, 0.25];
      var atomos = [], last = 0, next = 0;
      var L0 = haz.getTotalLength(), L = ramas.map(function (r) { return r.getTotalLength(); });
      var SPEED = 0.22;

      function nuevo() {
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('r', '3.4'); c.setAttribute('class', 'sg-atomo');
        g.appendChild(c);
        atomos.push({ el: c, d: 0, rama: Math.random() < 0.5 ? 0 : 1 });
      }

      function loop(t) {
        var dt = last ? Math.min(t - last, 50) : 16; last = t;
        if (t > next) { nuevo(); next = t + 260 + Math.random() * 260; }
        for (var i = atomos.length - 1; i >= 0; i--) {
          var a = atomos[i];
          a.d += SPEED * dt;
          var pt;
          if (a.d < L0) pt = haz.getPointAtLength(a.d);
          else if (a.d < L0 + L[a.rama]) pt = ramas[a.rama].getPointAtLength(a.d - L0);
          else {
            brillo[a.rama] = Math.min(0.95, brillo[a.rama] + 0.18);
            g.removeChild(a.el); atomos.splice(i, 1); continue;
          }
          a.el.setAttribute('cx', pt.x); a.el.setAttribute('cy', pt.y);
        }
        for (var k = 0; k < 2; k++) {
          brillo[k] = Math.max(0.25, brillo[k] - dt * 0.0006);
          manchas[k].style.opacity = brillo[k];
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
  <script>
    // Experimentos de doble rendija de Feynman: curvas P1, P2 y P12, impactos
    // que llegan uno por uno (balas y electrones) y ondas que se propagan.
    (function () {
      var NS = 'http://www.w3.org/2000/svg';
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var Y1 = 120, Y2 = 180, YC = 150, X0 = 640, AMP = 210;

      function gauss(y, c, s) { return Math.exp(-Math.pow((y - c) / s, 2) / 2); }
      var dist = {
        balas: {
          p1: function (y) { return gauss(y, Y1, 34); },
          p2: function (y) { return gauss(y, Y2, 34); },
          p12: function (y) { return 0.5 * (gauss(y, Y1, 34) + gauss(y, Y2, 34)); }
        },
        ondas: {
          p1: function (y) { return gauss(y, Y1, 46); },
          p2: function (y) { return gauss(y, Y2, 46); },
          p12: function (y) { var e = gauss(y, YC, 58); var c = Math.cos((y - YC) * 0.075); return e * c * c; }
        }
      };
      dist.electrones = dist.ondas;

      function curva(f, norm) {
        var d = '';
        for (var y = 30; y <= 270; y += 2) {
          var x = X0 + AMP * f(y) / norm;
          d += (y === 30 ? 'M' : 'L') + x.toFixed(1) + ' ' + y;
        }
        return d;
      }
      function maximo(f) { var m = 0; for (var y = 30; y <= 270; y++) m = Math.max(m, f(y)); return m; }
      function linea(g, d, cls) { var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('class', cls); g.appendChild(p); }
      function texto(g, x, y, t) { var e = document.createElementNS(NS, 'text'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('class', 'fy-ley'); e.textContent = t; g.appendChild(e); }

      // muestreo por rechazo de la distribución P12
      function muestra(f, m) {
        for (var k = 0; k < 200; k++) {
          var y = 32 + Math.random() * 236;
          if (Math.random() * m < f(y)) return y;
        }
        return YC;
      }

      Array.prototype.forEach.call(document.querySelectorAll('.fy'), function (fig) {
        var tipo = fig.getAttribute('data-tipo');
        var D = dist[tipo];
        var curvas = fig.querySelector('.fy-curvas');
        var m1 = maximo(D.p1), m12 = maximo(D.p12);
        var nombre = tipo === 'ondas' ? 'I' : 'P';
        linea(curvas, curva(D.p1, m1 * 2.2), 'fy-p1');
        linea(curvas, curva(D.p2, m1 * 2.2), 'fy-p1');
        linea(curvas, curva(D.p12, m12), 'fy-p12');
        texto(curvas, X0 + AMP * 0.48, Y1 - 46, nombre + '₁');
        texto(curvas, X0 + AMP * 0.48, Y2 + 56, nombre + '₂');
        texto(curvas, X0 + AMP + 8, YC + 5, nombre + '₁₂');

        var impactos = fig.querySelector('.fy-impactos');
        var ondas = fig.querySelector('.fy-ondas');

        if (tipo === 'ondas') {
          // frentes de onda: desde la fuente y luego desde cada rendija
          var arcs = [];
          // cada grupo de ondas queda recortado a su tramo: fuente a muro y muro a pantalla
          var svg = fig.querySelector('svg'), defs = document.createElementNS(NS, 'defs');
          svg.insertBefore(defs, svg.firstChild);
          function recorte(id, x, w) {
            var cp = document.createElementNS(NS, 'clipPath'); cp.setAttribute('id', id);
            var r = document.createElementNS(NS, 'rect');
            r.setAttribute('x', x); r.setAttribute('y', 30); r.setAttribute('width', w); r.setAttribute('height', 240);
            cp.appendChild(r); defs.appendChild(cp);
            var g = document.createElementNS(NS, 'g'); g.setAttribute('clip-path', 'url(#' + id + ')'); ondas.appendChild(g);
            return g;
          }
          var gFuente = recorte('fy-clip-fuente', 96, 230), gRendijas = recorte('fy-clip-rendijas', 334, 264);
          function arco(cx, cy, r, a0, a1) {
            var p = document.createElementNS(NS, 'path'); p.setAttribute('class', 'fy-onda'); (cx === 90 ? gFuente : gRendijas).appendChild(p);
            return { el: p, cx: cx, cy: cy, r0: r, a0: a0, a1: a1 };
          }
          for (var k = 0; k < 4; k++) {
            arcs.push(arco(90, 150, k * 60, -0.9, 0.9));
            arcs.push(arco(330, Y1, k * 68, -1.3, 1.3));
            arcs.push(arco(330, Y2, k * 68, -1.3, 1.3));
          }
          var t0 = performance.now();
          (function anima(t) {
            var ph = ((t - t0) * 0.04) % 60;
            arcs.forEach(function (a) {
              var span = a.cx === 90 ? 240 : 270;
              var r = (a.r0 + ph * (a.cx === 90 ? 1 : 68 / 60)) % span + 6;
              var x0 = a.cx + r * Math.cos(a.a0), y0 = a.cy + r * Math.sin(a.a0);
              var x1 = a.cx + r * Math.cos(a.a1), y1 = a.cy + r * Math.sin(a.a1);
              a.el.setAttribute('d', 'M' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 0 1 ' + x1 + ' ' + y1);
              a.el.style.opacity = Math.max(0, 1 - r / span) * 0.9;
            });
            if (!still) requestAnimationFrame(anima);
          })(t0);
          return;
        }

        // balas y electrones: impactos uno por uno sobre la pantalla
        var cuenta = 0, MAX = tipo === 'electrones' ? 520 : 380;
        function impacto() {
          var y = muestra(D.p12, m12);
          var c = document.createElementNS(NS, 'circle');
          c.setAttribute('cx', (594 + Math.random() * 12).toFixed(1));
          c.setAttribute('cy', y.toFixed(1));
          c.setAttribute('r', tipo === 'balas' ? '2.3' : '1.4');
          c.setAttribute('class', 'fy-impacto');
          impactos.appendChild(c);
          if (++cuenta > MAX) { impactos.removeChild(impactos.firstChild); }
        }
        if (still) { for (var n = 0; n < MAX; n++) impacto(); return; }
        setInterval(impacto, tipo === 'balas' ? 70 : 45);
      });
    })();
  </script>
