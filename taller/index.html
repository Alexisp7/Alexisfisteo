<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de unidades</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#100817; --sup1:#1B1025; --sup2:#25132F; --prim:#9228E8; --sec:#C44AFF; --brillo:#E5A4FF;
  --biomasa:#56234D; --acido:#B8F52D; --texto:#F3EAF8; --mute:rgba(243,234,248,.56); --linea:rgba(196,74,255,.18);
  --display:"Barlow Semi Condensed","Bahnschrift","Arial Narrow",sans-serif; --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);color:var(--texto);font:14px/1.5 var(--display);overflow:hidden}
#visor{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#visor:active{cursor:grabbing}
/* viñeta para fundir la escena con el fondo */
.vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 52%,transparent 55%,rgba(16,8,23,.85) 100%)}

header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;pointer-events:none}
header>*{pointer-events:auto}
.marca{font:600 13px var(--display);letter-spacing:.32em;text-transform:uppercase;color:var(--brillo);display:flex;align-items:center;gap:12px}
.marca i{width:7px;height:7px;border-radius:50%;background:var(--acido);box-shadow:0 0 10px var(--acido);animation:late 3.4s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.5);opacity:.6}}
.marca small{font:400 11px var(--mono);letter-spacing:.04em;text-transform:none;color:var(--mute)}
.volver{font:400 11px var(--mono);color:var(--mute);text-decoration:none;letter-spacing:.06em;transition:color .3s}
.volver:hover{color:var(--brillo)}

.ficha{position:fixed;left:28px;top:50%;transform:translateY(-50%);width:min(300px,30vw);pointer-events:none}
.ficha .num{font:400 11px var(--mono);color:var(--acido);letter-spacing:.2em}
.ficha h1{font:500 40px/1 var(--display);letter-spacing:.01em;margin:8px 0 6px;color:var(--texto)}
.ficha .est{display:inline-block;font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brillo);border:1px solid var(--linea);padding:4px 9px;border-radius:20px}
.ficha ul{list-style:none;padding:0;margin:26px 0 0;border-top:1px solid var(--linea)}
.ficha li{padding:12px 0;border-bottom:1px solid var(--linea)}
.ficha li b{display:block;font:600 12px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--sec);margin-bottom:3px}
.ficha li span{font-size:13.5px;color:var(--mute);line-height:1.45}
.ficha .tris{margin-top:14px;font:400 10px var(--mono);color:var(--mute);letter-spacing:.08em}

.catalogo{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.catalogo p{font:400 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.unidad{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--linea);border-radius:10px;background:rgba(27,16,37,.55);backdrop-filter:blur(6px);font:500 14px var(--display);color:var(--texto);transition:border-color .3s,background .3s}
.unidad:hover,.unidad[aria-current="true"]{border-color:rgba(184,245,45,.5);background:rgba(37,19,47,.8)}
.unidad span{font:400 10px var(--mono);color:var(--acido)}
.unidad.vacia{cursor:default;color:var(--mute);border-style:dashed}
.unidad.vacia span{color:var(--mute)}

.mandos{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid var(--linea);border-radius:14px;background:rgba(27,16,37,.62);backdrop-filter:blur(8px)}
.mandos button{all:unset;cursor:pointer;font:400 11px var(--mono);letter-spacing:.05em;color:var(--mute);padding:8px 12px;border-radius:9px;transition:color .25s,background .25s;white-space:nowrap}
.mandos button:hover{color:var(--texto);background:rgba(146,40,232,.16)}
.mandos button[aria-pressed="true"]{color:var(--acido);background:rgba(184,245,45,.08)}
.mandos button:focus-visible,.unidad:focus-visible{outline:1px solid var(--sec);outline-offset:2px}
.mandos .sep{width:1px;background:var(--linea);margin:4px 2px}

#estado{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:400 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--brillo);pointer-events:none;transition:opacity .6s}
#estado:empty{opacity:0}
.pista{position:fixed;right:28px;bottom:30px;font:400 10px var(--mono);color:var(--mute);letter-spacing:.06em;text-align:right;pointer-events:none}

@media (max-width:820px){
  header{padding:16px 16px}
  .ficha{top:auto;bottom:86px;left:16px;transform:none;width:calc(100% - 32px)}
  .ficha h1{font-size:28px}
  .ficha ul,.ficha .tris{display:none}
  .catalogo{top:62px;right:16px;transform:none;flex-direction:row}
  .catalogo p,.unidad.vacia{display:none}
  .mandos{bottom:16px;max-width:calc(100% - 32px);overflow-x:auto}
  .mandos .sep,#b-glb{display:none}
  .pista{display:none}
}
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
</script>
</head>
<body>
<canvas id="visor" aria-label="Visor 3D de la unidad. Arrastra para girar, rueda para acercar."></canvas>
<div class="vineta"></div>

<header>
  <div class="marca"><i></i>Taller <small>· unidades del Enjambre</small></div>
  <a class="volver" href="../bitacora.html">← Bitácora</a>
</header>

<aside class="ficha" aria-live="polite">
  <div class="num">UNIDAD <span id="f-num">—</span></div>
  <h1 id="f-nombre">&nbsp;</h1>
  <span class="est" id="f-estado"></span>
  <ul id="f-partes"></ul>
  <div class="tris" id="f-tris"></div>
</aside>

<nav class="catalogo" aria-label="Unidades">
  <p>Unidades</p>
  <button class="unidad" data-unidad="huevo" aria-current="true"><span>01</span>Huevo latente</button>
  <div class="unidad vacia"><span>02</span>por diseñar</div>
</nav>

<div class="mandos" role="toolbar" aria-label="Vista">
  <button id="b-girar" aria-pressed="true">Girar solo</button>
  <button id="b-respirar" aria-pressed="true">Respirar</button>
  <button id="b-malla" aria-pressed="false">Malla</button>
  <button id="b-vista">Encuadrar</button>
  <span class="sep"></span>
  <button id="b-glb">Descargar .glb</button>
</div>

<div id="estado">Gestando…</div>
<div class="pista">arrastra · rueda · clic derecho mueve</div>

<script type="module" src="./taller.js"></script>
</body>
</html>
